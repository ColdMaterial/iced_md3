# Builds the WASM showcase and the rustdoc API reference, then publishes both
# to GitHub Pages as a single static site.
name: Deploy site to Pages

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: --cfg docsrs

on:
  # Runs on pushes targeting the default branch
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install Rust toolchains
        run: |
          rustup update stable
          rustup default stable
          rustup target add wasm32-unknown-unknown
          rustup toolchain install nightly --profile minimal

      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          # The workspace and the WASM target produce different artifacts,
          # so keep their caches apart.
          key: ${{ runner.os }}-pages

      # `wasm-bindgen` refuses to process a module built by a different
      # version of itself, so the CLI must match `Cargo.lock` exactly.
      - name: Resolve wasm-bindgen version
        id: wasm_bindgen
        run: |
          version=$(sed -n '/^name = "wasm-bindgen"$/,/^version = /p' Cargo.lock \
            | sed -n 's/^version = "\(.*\)"$/\1/p' \
            | head -n 1)
          echo "Resolved wasm-bindgen version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm_bindgen.outputs.version }}

      - name: Build the showcase for the web
        run: |
          cargo build --release --target wasm32-unknown-unknown -p showcase
          # The showcase is served from the site root, so `index.html` can load
          # `showcase.js` without any redirects.
          wasm-bindgen \
            --target web \
            --no-typescript \
            --out-dir publish \
            --out-name showcase \
            target/wasm32-unknown-unknown/release/showcase.wasm

      - name: Generate rustdoc documentation
        run: cargo +nightly doc --no-deps -p iced_m3 --all-features

      - name: Assemble the site
        run: |
          mkdir -p publish
          cp -r ./target/doc/. ./publish/
          # Copied last so that the site files always win over rustdoc output.
          cp -a ./site/. ./publish/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './publish/'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
